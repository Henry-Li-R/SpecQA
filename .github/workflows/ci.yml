name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_CHUNKS_KEY: ${{ vars.S3_CHUNKS_KEY }}
      WEAVIATE_COLLECTION: ${{ vars.WEAVIATE_COLLECTION }}
      WEAVIATE_URL: ${{ vars.WEAVIATE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt
      - name: Run unit tests
        run: |
          python3 -m unittest \
            tests/test_chatgpt_client.py \
            tests/test_pipeline.py

  integration-tests:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_CHUNKS_KEY: ${{ vars.S3_CHUNKS_KEY }}
      WEAVIATE_COLLECTION: ${{ vars.WEAVIATE_COLLECTION }}
      WEAVIATE_URL: ${{ vars.WEAVIATE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Cache model downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: ${{ runner.os }}-hf-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt
      - name: Start Weaviate
        run: docker compose -f weaviate/docker-compose.yml up -d
      - name: Wait for Weaviate
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:8080/v1/.well-known/ready >/dev/null; then
              echo "Weaviate is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Weaviate did not become ready in time."
          exit 1
      # - name: Ingest test data # weaviate_ingest_combined.py not used for aws branch
      #   run: python3 scripts/weaviate_ingest_combined.py
      - name: Run integration tests
        run: python3 -m unittest tests/test_pipeline_integration.py
