name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      PHOENIX_COLLECTOR_ENDPOINT: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt
      - name: Run unit tests
        run: |
          python3 -m unittest \
            tests/test_chatgpt_client.py \
            tests/test_pipeline.py \
            tests/test_run_eval_orchestration.py

  integration-and-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      WEAVIATE_URL: http://localhost:8080
      WEAVIATE_GRPC_PORT: "50051"
      PHOENIX_COLLECTOR_ENDPOINT: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Cache model downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: ${{ runner.os }}-hf-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt
      - name: Start Weaviate
        run: docker compose -f weaviate/docker-compose.yml up -d
      - name: Wait for Weaviate
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:8080/v1/.well-known/ready >/dev/null; then
              echo "Weaviate is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Weaviate did not become ready in time."
          exit 1
      - name: Ingest test data
        run: python3 scripts/weaviate_ingest_combined.py
      - name: Run integration tests
        run: python3 -m unittest tests/test_pipeline_integration.py
      - name: Run eval
        run: make eval
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.sha }}
          path: eval/results/
